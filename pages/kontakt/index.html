<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | Gabinet Kosmetyczny Anette</title>
  <meta name="description" content="Skontaktuj się z Gabinetem Kosmetycznym Anette, aby umówić się na wizytę lub zadać pytanie. Znajdziesz tu formularz kontaktowy i dane adresowe.">
  <meta name="theme-color" content="#d67c2d">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">

  <link rel="stylesheet" href="/styles.css">
  <script src="/assets/js/typography.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>

  <main class="standalone">
    <section id="kontakt">
      <h2>Kontakt</h2>
      <p class="section-lead">
        Opisz potrzeby swojej skóry lub wybrany zabieg. Wrócimy do Ciebie z wstępną rekomendacją
        i propozycją terminu konsultacji w ciągu 24 godzin.
      </p>
      <form>
        <div>
          <label for="name">Imię i nazwisko</label>
          <input id="name" name="name" type="text" placeholder="np. Anna Nowak" required>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="np. kontakt@twojafirma.pl" required>
        </div>
        <div>
          <label for="message">Wiadomość</label>
          <textarea id="message" name="message" placeholder="Opisz potrzeby skóry lub interesujący Cię zabieg..." required></textarea>
        </div>
        <button class="button" type="submit">Wyślij wiadomość</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>
</html>
