<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | Gabinet Kosmetyczny Anette</title>
  <meta name="description" content="Skontaktuj się z Gabinetem Kosmetycznym Anette, aby umówić się na wizytę lub zadać pytanie. Znajdziesz tu formularz kontaktowy i dane adresowe.">
  <meta name="theme-color" content="#d67c2d">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png">

  <link rel="stylesheet" href="../../styles.css">
  <script src="../../assets/js/typography.js" defer></script>
  <script src="../../assets/js/app.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>

  <main class="standalone">
    <section id="kontakt">
      <h2>Kontakt</h2>
      <p class="section-lead">
        Jesteś o krok od chwili dla siebie. Skontaktuj się telefonicznie, napisz wiadomość lub odwiedź nas osobiście w sercu Gliwic.
      </p>

      <div class="contact-wrapper">
        <!-- Wizytówka z danymi i zdjęciem -->
        <div class="contact-card-grid">
          <div class="contact-details-content">
            <div>
              <h3>Gabinet Kosmetyczny Anette</h3>
              <address>
                ul. Cichociemnych 18<br>
                44-100 Gliwice
              </address>
            </div>
            
            <div class="contact-data">
              <a href="tel:+48500000000" class="contact-item">
                <span class="contact-icon">📞</span> +48 500 000 000
              </a>
              <a href="mailto:kontakt@anette.pl" class="contact-item">
                <span class="contact-icon">✉️</span> kontakt@anette.pl
              </a>
            </div>

            <div class="contact-social">
              <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="button">
                Gabinet Anette na Facebooku
              </a>
            </div>
          </div>
          <div class="contact-visual">
            <img src="../o-gabinecie/media/recepcja.jpg" alt="Eleganckie wnętrze recepcji Gabinetu Anette" loading="lazy">
          </div>
        </div>

        <!-- Mapa dojazdu -->
        <div id="mapa">
          <h3>Jak dojechać?</h3>
          <iframe 
            class="map-frame"
            src="https://maps.google.com/maps?q=ul.+Cichociemnych+18,+Gliwice&t=&z=15&ie=UTF8&iwloc=&output=embed" 
            allowfullscreen="" 
            loading="lazy" 
            title="Mapa dojazdu do Gabinetu Anette, ul. Cichociemnych 18, Gliwice">
          </iframe>
        </div>
      </div>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>
</html>
